<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherWear AI - Twój Asystent Ubioru</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="clouds-background">
        <div class="cloud layer-1"></div>
        <div class="cloud layer-2"></div>
    </div>

    <main class="app-container">
        
        <header class="app-header">
            <div class="bot-profile">
                <div class="avatar">
                    <i class="fa-solid fa-cloud-sun-rain"></i>
                    <span class="status-dot"></span>
                </div>
                <div>
                    <h1>WeatherWear AI</h1>
                    <p>Doradca stylizacji pogodowej</p>
                </div>
            </div>
            <button id="clearHistoryBtn" class="clear-btn" title="Wyczyść historię rozmów">
                <i class="fa-solid fa-trash-can"></i>
            </button>
        </header>

        <section class="chat-area" id="chatArea">
            </section>

        <footer class="input-area">
            <form id="weatherForm" autocomplete="off">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="cityInput" 
                        placeholder="Wpisz miasto (np. Toruń, Warszawa)..." 
                        required
                    >
                    <button type="submit" id="submitBtn">
                        <span>Poproś o sugestię</span>
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                    </button>
                </div>
            </form>
        </footer>

    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
